name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ===============================================================
  # JOB 1: Build Docker image & verify build integrity
  # ===============================================================
  build:
    name: Build & Package Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Fetch repository code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===============================================================
  # JOB 2: Deploy to remote server via SSH
  # ===============================================================
  deploy:
    name: Deploy to Server
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Server via SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY || secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY || vars.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST || '3.110.181.136' }}
          SERVER_USER: ${{ secrets.SERVER_USER || 'ubuntu' }}
        run: |
          echo "========================================="
          echo "🔑 Verifying SSH Private Key configuration..."
          echo "========================================="
          if [ -z "$SSH_KEY" ]; then
            echo "::error::SSH Key secret is empty! Please check GitHub: Settings -> Secrets and variables -> Actions -> Repository secrets (make sure it's named SERVER_SSH_KEY or SSH_KEY, not under Variables or Environments)."
            exit 1
          fi

          echo "✅ SSH Key found (${#SSH_KEY} characters). Configuring client..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Auto-repair key if PEM header/footer was omitted
          if [[ "$SSH_KEY" != *"BEGIN "* ]]; then
            echo "🔧 Auto-repairing private key: Adding missing PEM header and footer..."
            SSH_KEY=$(printf -- "-----BEGIN RSA PRIVATE KEY-----\n%s\n-----END RSA PRIVATE KEY-----\n" "$SSH_KEY")
          fi

          # Fix potential line-ending issues and write key
          printf "%s\n" "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Add server to known hosts
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          echo "🚀 Connecting to $SERVER_USER@$SERVER_HOST..."
          ssh -o StrictHostKeyChecking=accept-new -o PubkeyAcceptedKeyTypes=+ssh-rsa -o HostkeyAlgorithms=+ssh-rsa -i ~/.ssh/deploy_key "$SERVER_USER@$SERVER_HOST" '
            set -e
            echo "========================================="
            echo "🚀 Starting Feedants deployment on server"
            echo "========================================="

            # 1. Target directory where project is located on server
            APP_DIR="$HOME/feedants"
            echo "📁 Ensuring project directory exists: $APP_DIR"
            if [ ! -d "$APP_DIR" ]; then
              echo "Repository not found at $APP_DIR. Cloning repository..."
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi

            cd "$APP_DIR"

            # 2. Fetch latest changes from GitHub
            echo "📥 Fetching latest code from branch main..."
            git pull origin main

            # 3. Detect docker compose command
            if docker compose version &> /dev/null; then
              COMPOSE_CMD="docker compose"
            elif command -v docker-compose &> /dev/null; then
              COMPOSE_CMD="docker-compose"
            else
              echo "❌ Error: Docker Compose is not installed on the server."
              exit 1
            fi

            # 4. Build and restart backend container
            echo "🐳 Building and restarting backend service using: $COMPOSE_CMD"
            $COMPOSE_CMD up -d --build backend

            # 5. Clean up dangling images to conserve server storage
            echo "🧹 Pruning dangling docker images..."
            docker image prune -f

            # 6. Verify container status
            echo "📊 Verifying running containers:"
            $COMPOSE_CMD ps

            echo "========================================="
            echo "✅ Deployment completed successfully!"
            echo "========================================="
          '

