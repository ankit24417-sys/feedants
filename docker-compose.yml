services:
  mongodb:
    image: mongo:7-jammy
    container_name: feedants-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: feedants-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/feedants
      DB_NAME: feedants
      CORS_ORIGIN: "*"
      MAX_WORKERS: 0
      CACHE_TTL_SECONDS: 30
      JWT_SECRET: feedants_super_secret_jwt_key_2026
      JWT_EXPIRY: 7d
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: feedants-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
